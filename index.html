<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="講義文字起こしノート一覧">
    <link rel="stylesheet" href="./css/index.css">
    <script src="./css/highlight.js" defer></script>
    <script src="./css/search_engine.js" defer></script>
    <title>MOJIOKOSHI NOTE</title>
    <style>
      /* ====== index.html 専用追加スタイル ====== */
      body {
        background-color: #fdfaf1;
        background-image: radial-gradient(#e1d9c1 1px, transparent 1px);
        background-size: 20px 20px;
        font-family: 'Kiwi Maru', serif;
        margin: 0;
        padding: 20px;
      }

      .notebook-container {
        background: white;
        padding: 30px 40px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        border-left: 8px solid #ffcccc;
        border-radius: 4px;
        position: relative;
        max-width: 1200px;
        margin: 40px auto;
        min-height: 80vh;
      }

      h1.notebook-title {
        background-color: #e3f2fd;
        padding: 20px 15px;
        border-radius: 12px;
        text-align: center;
        font-size: 1.8em;
        border-bottom: 4px solid #bbdefb;
        margin: 0 0 30px;
        color: #1e3050;
      }
      h1.notebook-title span { color: #1976d2; }

      .main-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        padding: 10px 0;
      }

      .subject-card {
        background: #fff;
        border-radius: 12px;
        border: 1px solid #e0e0e0;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        overflow: hidden;
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .subject-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      }
      .subject-card-header {
        background-color: #f1f8e9;
        color: #333;
        padding: 14px 16px;
        font-size: 16px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid #dcedc8;
        border-left: 6px solid #c5e1a5;
      }
      .subject-card-header .count {
        margin-left: auto;
        background: #fff;
        border: 1px solid #c5e1a5;
        border-radius: 20px;
        padding: 1px 8px;
        font-size: 11px;
        color: #558b2f;
      }
      .subject-card-body {
        padding: 5px 0;
      }
      .lecture-link {
        display: block;
        padding: 10px 16px;
        font-size: 13px;
        color: #444;
        text-decoration: none;
        border-bottom: 1px solid #f5f5f5;
        transition: background 0.2s;
        line-height: 1.4;
      }
      .lecture-link:last-child { border-bottom: none; }
      .lecture-link:hover { background: #f9fbf7; }
      
      .lec-date {
        font-size: 11px;
        color: #777;
        display: block;
        margin-bottom: 2px;
        font-weight: 600;
      }
      .lec-name {
        display: block;
        font-weight: 500;
        color: #222;
        margin-bottom: 2px;
      }
      .lec-speaker {
        font-size: 11px;
        color: #970c25;
        font-weight: 500;
      }

      mark {
        background: #fff9c4;
        color: #d32f2f;
        font-weight: 700;
        padding: 0 2px;
        border-radius: 2px;
      }

      .last-updated {
        text-align: right;
        font-size: 11px;
        color: #999;
        margin-bottom: 10px;
      }

      .empty-state {
        grid-column: 1 / -1;
        text-align: center;
        color: #bbb;
        padding: 80px 20px;
      }
      .empty-state .icon { font-size: 48px; display: block; margin-bottom: 10px; }

      @media (max-width: 600px) {
        .notebook-container { padding: 15px; margin: 10px; }
        h1.notebook-title { font-size: 1.4em; }
        .main-grid { grid-template-columns: 1fr; }
      }

      /* ====== 検索機能のスタイル ====== */
      .search-section {
        margin: 20px 0 30px;
        position: relative;
        max-width: 800px;
        margin-left: auto;
        margin-right: auto;
      }
      .search-input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        background: #fff;
        border: 2px solid #e3f2fd;
        border-radius: 50px;
        padding: 5px 20px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 12px rgba(30, 48, 80, 0.05);
      }
      .search-input-wrapper:focus-within {
        border-color: #1976d2;
        box-shadow: 0 6px 20px rgba(25, 118, 210, 0.15);
        transform: translateY(-2px);
      }
      #searchInput {
        width: 100%;
        border: none;
        padding: 12px 15px;
        font-size: 16px;
        font-family: 'Kiwi Maru', serif;
        outline: none;
        background: transparent;
      }
      .search-icon {
        color: #1976d2;
        font-size: 20px;
      }
      #searchStatus {
        font-size: 11px;
        color: #777;
        margin-top: 8px;
        text-align: center;
        min-height: 16px;
      }

      .search-results {
        display: none;
        margin-top: 20px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        max-height: 500px;
        overflow-y: auto;
        border: 1px solid #e3f2fd;
        padding: 10px;
      }
      .search-results.active { display: block; }
      .search-result-item {
        padding: 15px;
        border-bottom: 1px solid #f0f7ff;
        transition: background 0.2s;
        cursor: pointer;
        border-radius: 8px;
        margin-bottom: 5px;
        display: block;
        text-decoration: none;
        color: inherit;
      }
      .search-result-item:hover { background: #f0f7ff; }
      .search-result-item:last-child { border-bottom: none; }
      .result-title {
        font-weight: 700;
        color: #1976d2;
        font-size: 14px;
        margin-bottom: 4px;
        display: block;
      }
      .result-content {
        font-size: 13px;
        color: #555;
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .result-meta {
        font-size: 11px;
        color: #999;
        margin-top: 6px;
        display: flex;
        justify-content: space-between;
      }
      .similarity-tag {
        background: #e8f5e9;
        color: #2e7d32;
        padding: 2px 8px;
        border-radius: 10px;
        font-weight: 700;
      }

      /* プログレスバー */
      .loading-progress-container {
        width: 100%;
        height: 4px;
        background: #eee;
        border-radius: 2px;
        margin-top: 4px;
        display: none;
      }
      .loading-progress-bar {
        height: 100%;
        background: #1976d2;
        width: 0%;
        transition: width 0.3s;
      }
    </style>
</head>
<body>

<div id="notice-message" class="notice-bar">リンク先が準備されていません</div>

<!-- ハンバーガーメニュー -->
<div class="btn-trigger" id="btn09" onclick="toggleMenu(this)">
    <span></span><span></span><span></span>
</div>

<nav class="side-menu" id="sideMenu" onclick="switchMenu(btn09)">
    <h2>リンク集</h2>
    <ul class="menu-list" id="dynamicMenu">
        <li style="padding:12px 16px;color:#a0b4cc;font-size:12px;">読み込み中...</li>
    </ul>
</nav>

<div class="overlay" id="overlay" onclick="closeMenu(document.getElementById('btn09'))"></div>

<!-- ページ本体 -->
<div class="notebook-container">
    <div class="last-updated" id="lastUpdated">--</div>
    <h1 class="notebook-title">MOJIOKOSHI <span>NOTE</span></h1>

    <!-- 検索セクション -->
    <div class="search-section">
        <div class="search-input-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="講義内容を意味で検索... (例: ぜんそくの治療)" disabled>
        </div>
        <div class="loading-progress-container" id="searchProgressContainer">
            <div class="loading-progress-bar" id="searchProgressBar"></div>
        </div>
        <div id="searchStatus">検索インデックスをロード中...</div>
        <div id="searchFilters" class="search-filters"></div>
        <div id="searchResults" class="search-results">
            <!-- 検索結果がここに表示される -->
        </div>
    </div>
    
    <div id="mainGrid" class="main-grid">
        <div class="empty-state">
            <span class="icon">📚</span>
            <span>講義ノートを読み込み中...</span>
        </div>
    </div>
</div>


<script>
    /* ============================================================
       メインページ: html/html/ 以下のフォルダを動的スキャンして
       科目カードを生成する
       ============================================================ */
    const isMobile = window.matchMedia('(max-width: 600px)');

    // ── メニュー開閉 ──────────────────────────────────
    function toggleMenu(btn) {
        if (btn.classList.contains('active')) {
            closeMenu();
        } else {
            btn.classList.add('active');
            document.getElementById('sideMenu').classList.add('active');
            document.getElementById('overlay').classList.add('active');
            if (isMobile.matches) document.body.style.overflow = 'hidden';
        }
    }
    function closeMenu() {
        document.getElementById('btn09').classList.remove('active');
        document.getElementById('sideMenu').classList.remove('active');
        document.getElementById('overlay').classList.remove('active');
        document.body.style.overflow = 'auto';
    }
    function switchMenu(btn) {
        btn.classList.add('active');
        document.getElementById('sideMenu').classList.add('active');
        document.getElementById('overlay').classList.add('active');
    }
    const sideMenu = document.getElementById('sideMenu');
    sideMenu.addEventListener('mouseenter', () => { document.body.style.overflow = 'hidden'; });
    sideMenu.addEventListener('mouseleave', () => { document.body.style.overflow = 'auto'; });

    // ── 未準備リンクの処理 ────────────────────────────
    document.addEventListener('click', function(e) {
        if (e.target.tagName === 'A' && e.target.getAttribute('href') === 'None') {
            e.preventDefault();
            const notice = document.getElementById('notice-message');
            notice.classList.add('show');
            setTimeout(() => notice.classList.remove('show'), 2500);
        }
    });

    // ── HTMLを動的スキャンしてカード生成 ─────────────
    // GitHub Pages や file:// では directory listing ができないため、
    // 既知の index.html リンクリストを manifest.json から読み込む方式にする。
    // manifest.json が存在しない場合は、サイドメニューのリンクを元に生成する。
    async function buildFromManifest() {
        try {
            const resp = await fetch('./manifest.json');
            if (!resp.ok) throw new Error('no manifest');
            const data = await resp.json();
            renderCards(data);
            renderSideMenu(data);
            updateTimestamp(data.generated);
        } catch {
            // manifestなければサイドメニューのHTMLをパース
            renderFromSideMenu();
        }
    }

    function renderCards(data) {
        const grid = document.getElementById('mainGrid');
        if (!data.subjects || data.subjects.length === 0) {
            grid.innerHTML = '<div class="empty-state"><span class="icon">📭</span><span>まだ講義ノートがありません</span></div>';
            return;
        }
        grid.innerHTML = data.subjects.map(subject => `
            <div class="subject-card">
                <div class="subject-card-header" onclick="toggleCard(this)">
                    📖 ${escHtml(subject.name)}
                    <span class="count">${subject.lectures.length}件</span>
                </div>
                <div class="subject-card-body">
                    ${subject.lectures.map(lec => `
                        <a class="lecture-link" href="${escHtml(lec.path)}">
                            <span class="lec-date">${escHtml(lec.date)}</span>
                            <span class="lec-name">${escHtml(lec.name)}</span>
                            <span class="lec-speaker">${escHtml(lec.speaker || '')}</span>
                        </a>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    function renderSideMenu(data) {
        if (!data.subjects) return;
        const ul = document.getElementById('dynamicMenu');
        ul.innerHTML = data.subjects.map(subject => `
            <li class="menu-folder">
                <div class="folder-toggle">${escHtml(subject.name)} <span>▶</span></div>
                <ul class="submenu">
                    ${subject.lectures.map(lec => `
                        <li><a href="${escHtml(lec.path)}">
                            <span class="date">${escHtml(lec.date)}</span>
                            <span class="speaker">${escHtml(lec.speaker || '')}</span>
                            <br>${escHtml(lec.name)}
                        </a></li>
                    `).join('')}
                </ul>
            </li>
        `).join('');
        bindFolderToggles();
    }

    // manifest.jsonがない場合：既存のサイドメニューHTMLをパース
    function renderFromSideMenu() {
        // 既存 side-menu のリンクを収集してカードを生成する
        const existingLinks = document.querySelectorAll('.side-menu .submenu a');
        if (existingLinks.length === 0) {
            document.getElementById('mainGrid').innerHTML =
                '<div class="empty-state"><span class="icon">📭</span><span>まだ講義ノートがありません</span></div>';
            return;
        }

        const subjects = {};
        existingLinks.forEach(a => {
            const folderEl = a.closest('.menu-folder');
            const subjectName = folderEl ? folderEl.querySelector('.folder-toggle').childNodes[0].textContent.trim() : '未分類';
            if (!subjects[subjectName]) subjects[subjectName] = [];
            const dateEl = a.querySelector('.date');
            const speakerEl = a.querySelector('.speaker');
            subjects[subjectName].push({
                path: a.getAttribute('href'),
                date: dateEl ? dateEl.textContent : '',
                name: a.lastChild ? a.lastChild.textContent.trim() : a.textContent.trim(),
                speaker: speakerEl ? speakerEl.textContent : ''
            });
        });

        renderCards({ subjects: Object.entries(subjects).map(([name, lectures]) => ({ name, lectures })) });
        updateTimestamp();
    }

    function updateTimestamp(ts) {
        const el = document.getElementById('lastUpdated');
        if (ts) {
            el.textContent = '最終更新: ' + new Date(ts).toLocaleString('ja-JP');
        } else {
            el.textContent = '最終更新: ' + new Date().toLocaleDateString('ja-JP');
        }
    }

    function toggleCard(headerEl) {
        const body = headerEl.nextElementSibling;
        body.style.display = body.style.display === 'none' ? 'block' : 'block';
    }

    function bindFolderToggles() {
        document.querySelectorAll('.folder-toggle').forEach(folder => {
            folder.addEventListener('click', function() {
                const submenu = this.nextElementSibling;
                const arrow = this.querySelector('span');
                arrow.classList.toggle('active');
                if (submenu.style.maxHeight && submenu.style.maxHeight !== '0px') {
                    submenu.style.maxHeight = '0px';
                    submenu.style.opacity = '0';
                } else {
                    submenu.style.maxHeight = submenu.scrollHeight + 'px';
                    submenu.style.opacity = '1';
                }
            });
        });
    }

    function escHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── 起動 ──────────────────────────────────────────
    buildFromManifest();

    // 共通検索エンジン (search_engine.js) を使用
    window.addEventListener('load', () => {
        if (typeof initSearchComponent === 'function') {
            initSearchComponent({
                inputId: 'searchInput',
                resultsId: 'searchResults',
                statusId: 'searchStatus',
                progressId: 'searchProgressBar',
                progressContainerId: 'searchProgressContainer',
                filterContainerId: 'searchFilters',
                rootPath: './'
            });
        }
    });
</script>
<script src="./css/chat_widget.js" defer></script>
</body>
</html>
